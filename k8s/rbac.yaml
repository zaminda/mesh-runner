apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-runner-worker
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mesh-runner-worker-leader-election
  namespace: default
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mesh-runner-worker-leader-election
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mesh-runner-worker-leader-election
subjects:
  - kind: ServiceAccount
    name: mesh-runner-worker
    namespace: default
