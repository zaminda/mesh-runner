name: Build and Push API Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: robinhood.azurecr.io
          username: robinhood
          password: ${{ secrets.ROBINHOOD_KEY }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: robinhood.azurecr.io/mesh-runner/api:latest

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: robinhood.azurecr.io/mesh-runner/worker:latest
