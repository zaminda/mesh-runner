apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-runner
  labels:
    app: mesh-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mesh-runner
  template:
    metadata:
      labels:
        app: mesh-runner
    spec:
      containers:
        - name: api
          image: robinhood.azurecr.io/mesh-runner:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mesh-runner
  labels:
    app: mesh-runner
spec:
  type: ClusterIP
  selector:
    app: mesh-runner
  ports:
    - port: 80
      targetPort: 8080
